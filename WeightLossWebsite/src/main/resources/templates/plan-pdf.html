<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial;color:#24312c}h1{color:#1e7659}h2{border-bottom:1px solid #ddd;padding-bottom:5px}.day{page-break-inside:avoid;margin-bottom:18px}.meal,.workout,.exercise{margin:5px 0;padding:7px;background:#f2f7f4}.exercise{background:#fafcfb}.small{color:#666;font-size:11px}.time{float:right;color:#1e7659;font-weight:bold}.label{font-weight:bold;color:#1e7659}</style></head><body><h1>WellPlan Weekly Plan</h1><p>Daily calorie target: <b th:text="${plan.dailyCalorieTarget}"></b></p><div class="day" th:each="day : ${plan.days}"><h2 th:text="${day.day}"></h2><div class="meal" th:each="meal : ${day.meals}"><b th:text="${meal.category + ': ' + meal.name}"></b><br><span class="small" th:text="${meal.calories + ' calories - ' + meal.description}"></span></div><div class="workout"><span class="time" th:text="${day.workout.totalMinutes + ' minutes'}"></span><b th:text="${'Workout: ' + day.workout.name}"></b><br><span class="small" th:text="${day.workout.focus + ' - ' + day.workout.details}"></span><p><span class="label">Warm-up: </span><span class="small" th:text="${day.workout.warmup}"></span></p><div class="exercise" th:each="exercise : ${day.workout.exercises}"><b th:text="${exercise.name}"></b><br><span class="small" th:text="${'Machine/equipment: ' + exercise.machine + ' | ' + exercise.sets + ' sets | ' + exercise.reps + ' | ' + exercise.restSeconds + ' sec rest'}"></span><br><span class="small" th:text="${exercise.notes}"></span></div><p><span class="label">Cool-down: </span><span class="small" th:text="${day.workout.cooldown}"></span></p></div></div><p class="small">General wellness guidance only. Consult a qualified professional for medical advice.</p></body></html>
